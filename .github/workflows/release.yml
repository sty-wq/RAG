name: Release

# 推送 v 开头的 tag（比如 v0.1.0）时运行：先跑测试，通过了再构建镜像、推送到 GHCR
on:
  push:
    tags: ["v*"]

jobs:
  test:
    # 直接复用 ci.yml 里的检查（ruff + pytest），不用把步骤再抄一遍
    uses: ./.github/workflows/ci.yml

  image:
    needs: test                     # 测试通过了才会构建镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write               # 允许往 GitHub 的镜像仓库（GHCR）推镜像
    steps:
      - uses: actions/checkout@v4

      # 镜像名必须全部小写，而仓库名 RAG 是大写的。${变量,,} 是 bash 里"转成小写"的写法
      - name: 生成镜像名
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # GitHub 的机器是 x86（amd64）的。QEMU 能模拟 ARM CPU，让它也能构建 arm64 镜像
      - uses: docker/setup-qemu-action@v4
      # buildx 是 Docker 的新一代构建工具，支持一次构建多种架构
      - uses: docker/setup-buildx-action@v4

      # 用 GitHub 自动提供的临时令牌登录，不需要自己配置任何密钥
      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 根据 tag 生成镜像的标签：v0.1.0 → 0.1.0、0.1、latest
      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64     # 一次构建两种架构：x86 服务器和 Mac / Jetson 都能用
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha                   # 用 GitHub Actions 的缓存，依赖没变时下次构建会快很多
          cache-to: type=gha,mode=max
