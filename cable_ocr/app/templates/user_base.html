<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电缆文档识别</title><style>
body{margin:0;background:#f4f7fa;color:#21384c;font:16px system-ui,sans-serif}header{padding:22px 8%;background:#173b50;color:white;display:flex;justify-content:space-between}header a{color:white}main{max-width:1060px;margin:38px auto;padding:0 22px}h1{font-size:30px}p{line-height:1.7}.card{background:white;border:1px solid #dce5ec;padding:28px;border-radius:12px;margin:20px 0}.muted{color:#607587}button,.button{display:inline-block;border:0;border-radius:7px;background:#126e8d;color:white;padding:12px 22px;text-decoration:none;cursor:pointer;font-size:16px}input,select{font:inherit;padding:12px;border:1px solid #cad7df;border-radius:6px;max-width:100%;box-sizing:border-box}label{display:block;margin:15px 0 6px}a{color:#176b8b}table{border-collapse:collapse;width:100%;min-width:650px}td,th{border-bottom:1px solid #e1e8ed;padding:12px;text-align:left;vertical-align:top}.scroll{overflow-x:auto}.warning{background:#fff5dd;padding:16px;border-radius:8px;color:#795314}.missing{color:#a04325;background:#fff1e8}.badge{display:inline-block;background:#e6f1f6;padding:8px 13px;border-radius:6px}progress{width:100%;height:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere}header form{margin:0}header button{padding:3px 8px;background:transparent;font-size:14px}</style><header><a href="/app">电缆文档识别</a><form action="/logout" method="post"><button>退出</button></form></header><main>{% block content %}{% endblock %}</main></html>
