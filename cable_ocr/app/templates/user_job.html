{% extends 'user_base.html' %}{% block content %}<a href="/app">← 上传其他文档</a><h1>{{job.filename}}</h1><p class="muted">识别通道：{{job.ocr_provider_label|default('百度 OCR')}} · 创建时间：{{job.created|ts}} UTC</p>
<div class="card"><span class="badge" id="status"></span><p id="progress-text"></p><progress id="progress"></progress><p id="review"></p><p id="poll-message">页面将自动更新状态。</p></div>
<section id="results"><h2>识别结果</h2><p id="confirmation" class="warning"></p><div id="blocks"></div><ul id="unresolved"></ul><p><a href="/app/jobs/{{job.id}}/result.json">查看 JSON</a> · <a href="/app/jobs/{{job.id}}/result.json?download=true">下载 JSON</a></p></section>
<script>
const initial={{job|tojson}},fields={{fields|tojson}};
function node(tag,text,parent){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(parent)parent.append(el);return el}
function table(rows,parent){const t=node('table',undefined,parent);for(const row of rows){const tr=node('tr',undefined,t);for(const c of row){const td=node('td',c.text??'待确认',tr);td.style.whiteSpace='pre-wrap';if(c.uncertain)node('small',' · 字符待核对',td);if(c.merged)node('small',' · 合并单元格',td)}}}
function render(v){document.querySelector('#status').textContent=v.status_label;document.querySelector('#progress-text').textContent=`已处理 ${v.processed_pages} / ${v.page_count||'待确定'} 页`;document.querySelector('#progress').max=v.page_count||1;document.querySelector('#progress').value=v.processed_pages;document.querySelector('#review').textContent=v.admission_message||v.channel_message|| (v.waiting_review?'该任务正在等待管理员复核。':'');const confirmation=document.querySelector('#confirmation');confirmation.textContent=v.confirmed?'人工复核已完成':v.status==='PARTIAL'?'部分完成，存在未解决内容；候选文字请核对原文。':'';confirmation.hidden=!confirmation.textContent;const out=document.querySelector('#blocks');out.replaceChildren();if(v.schema_version==='ocr-result-v3'){for(const p of v.pages){const section=node('section',undefined,out);section.className='card';node('h3',`第 ${p.page_index+1} 页 · ${({lines:'逐行文本',mixed:'表格与逐行文本',structured_table:'结构化表格'})[p.parse_mode]||'无文本结果'}`,section);if(p.has_error)node('p','此页处理不完整，请管理员查看原因。',section);if(p.content_status==='NO_TEXT_DETECTED')node('p','未检测到文字',section);for(const b of p.blocks){if(b.type==='table'){if(b.schema_status==='MODEL_REPORTED_UNVERIFIED')node('p','模型识别的表格，请对照原图核对行列与文字。',section);table(b.rows.map(r=>r.cells),section);}else for(const l of b.lines){const line=node('p',l.text??'无法判断',section);line.style.whiteSpace='pre-wrap';if(l.text_status==='confirmed')node('small',' 已确认',line);else if(l.text_status==='unresolved')node('small',' 无法判断',line);if(l.order_quality==='UNCERTAIN')node('small',' · 阅读顺序待核对',line)}}}}else if(v.rows.length)table([fields.map(f=>({text:f})),...v.rows.map(r=>fields.map(f=>({text:r[f]})))],out);document.querySelector('#results').hidden=!out.children.length;const ul=document.querySelector('#unresolved');ul.replaceChildren();for(const u of v.unresolved)node('li',`第 ${u.page} 页：${u.message}`,ul)}
async function poll(){try{const r=await fetch('/app/api/jobs/{{job.id}}');if(!r.ok)throw Error();render(await r.json())}catch{document.querySelector('#poll-message').textContent='暂时无法更新，将自动重试。'}}setInterval(poll,2000);render(initial);
</script>{% endblock %}
